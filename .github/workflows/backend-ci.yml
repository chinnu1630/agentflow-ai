name: Backend CI

on:
  push:
    branches:
      - main
    paths:
      - "backend/**"
      - "scripts/bootstrap_ec2.sh"
      - "scripts/test_bootstrap_ec2.sh"
      - "scripts/deploy_ec2.sh"
      - "scripts/test_deploy_ec2.sh"
      - "scripts/rollback_ec2.sh"
      - "scripts/test_rollback_ec2.sh"
      - "docker-compose.yml"
      - "docker-compose.ec2.yml"
      - ".env.example"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    branches:
      - main
    paths:
      - "backend/**"
      - "scripts/bootstrap_ec2.sh"
      - "scripts/test_bootstrap_ec2.sh"
      - "scripts/deploy_ec2.sh"
      - "scripts/test_deploy_ec2.sh"
      - "scripts/rollback_ec2.sh"
      - "scripts/test_rollback_ec2.sh"
      - "docker-compose.yml"
      - "docker-compose.ec2.yml"
      - ".env.example"
      - ".github/workflows/backend-ci.yml"

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, type-check, and test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      redis:
        image: redis:8.0-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      RATE_LIMIT_TEST_REDIS_URL: redis://127.0.0.1:6379/0

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run Ruff
        run: ruff check app tests

      - name: Run mypy
        run: mypy app

      - name: Run tests with coverage gate
        run: pytest -q

  ec2-bootstrap-quality:
    name: Validate EC2 automation
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate Bash syntax
        run: |
          bash -n \
            scripts/bootstrap_ec2.sh \
            scripts/test_bootstrap_ec2.sh \
            scripts/deploy_ec2.sh \
            scripts/test_deploy_ec2.sh \
            scripts/rollback_ec2.sh \
            scripts/test_rollback_ec2.sh

      - name: Run ShellCheck
        run: |
          docker run --rm \
            --volume "$GITHUB_WORKSPACE:/repo" \
            --workdir /repo \
            koalaman/shellcheck:stable \
            -x \
            scripts/bootstrap_ec2.sh \
            scripts/test_bootstrap_ec2.sh \
            scripts/deploy_ec2.sh \
            scripts/test_deploy_ec2.sh \
            scripts/rollback_ec2.sh \
            scripts/test_rollback_ec2.sh

      - name: Run bootstrap unit tests
        run: bash scripts/test_bootstrap_ec2.sh

      - name: Run deployment unit tests
        run: bash scripts/test_deploy_ec2.sh

      - name: Run rollback unit tests
        run: bash scripts/test_rollback_ec2.sh

  container-smoke-test:
    name: PostgreSQL pgvector and Redis integration test
    needs:
      - quality
      - ec2-bootstrap-quality
    runs-on: ubuntu-latest
    timeout-minutes: 25

    env:
      POSTGRES_USER: agentflow
      POSTGRES_PASSWORD: agentflow-ci-password
      POSTGRES_DB: agentflow
      POSTGRES_PORT: "5433"
      REDIS_PASSWORD: agentflow-ci-redis-password
      REDIS_PORT: "6380"
      RATE_LIMIT_KEY_HMAC_SECRET: agentflow-ci-rate-limit-hmac-secret
      BACKEND_PORT: "8000"
      TRUSTED_HOSTS: '["127.0.0.1","backend"]'
      AUTH_ENABLED: "true"
      AUTH_JWT_ISSUER: "https://ci.identity.agentflow.invalid/"
      AUTH_JWT_AUDIENCE: "agentflow-api"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Generate ephemeral JWT verification key
        run: |
          openssl genpkey             -algorithm RSA             -pkeyopt rsa_keygen_bits:2048             -out /tmp/agentflow-ci-private-key.pem

          openssl pkey             -in /tmp/agentflow-ci-private-key.pem             -pubout             -out /tmp/agentflow-ci-public-key.pem

          {
            echo "AUTH_JWT_PUBLIC_KEY<<AGENTFLOW_CI_PEM"
            cat /tmp/agentflow-ci-public-key.pem
            echo "AGENTFLOW_CI_PEM"
          } >> "$GITHUB_ENV"

          rm -f             /tmp/agentflow-ci-private-key.pem             /tmp/agentflow-ci-public-key.pem

      - name: Validate EC2 Compose isolation
        run: |
          docker compose \
            -f docker-compose.yml \
            -f docker-compose.ec2.yml \
            config --format json \
            > /tmp/agentflow-ec2-compose.json

          python3 - <<'PYTHON'
          import json
          from pathlib import Path

          config = json.loads(
              Path("/tmp/agentflow-ec2-compose.json").read_text(
                  encoding="utf-8"
              )
          )
          services = config["services"]

          for service_name in ("backend", "migrate", "postgres", "redis"):
              published_ports = services[service_name].get("ports", [])
              if published_ports:
                  raise SystemExit(
                      f"{service_name} unexpectedly publishes host ports: "
                      f"{published_ports}"
                  )

          frontend_ports = services["frontend"].get("ports", [])
          if len(frontend_ports) != 1:
              raise SystemExit(
                  "frontend must publish exactly one loopback-only port; "
                  f"found {frontend_ports}"
              )

          frontend_port = frontend_ports[0]
          expected_frontend_port = {
              "host_ip": "127.0.0.1",
              "target": 8501,
              "published": "8501",
              "protocol": "tcp",
          }
          for field_name, expected_value in expected_frontend_port.items():
              actual_value = frontend_port.get(field_name)
              if actual_value != expected_value:
                  raise SystemExit(
                      "frontend port isolation mismatch: "
                      f"{field_name}={actual_value!r}, "
                      f"expected {expected_value!r}"
                  )

          for service_name, service in services.items():
              logging = service.get("logging", {})
              options = logging.get("options", {})
              if (
                  logging.get("driver") != "json-file"
                  or options.get("max-size") != "10m"
                  or str(options.get("max-file")) != "5"
              ):
                  raise SystemExit(
                      f"{service_name} does not have bounded Docker logs: "
                      f"{logging}"
                  )

          print("EC2 Compose network isolation and logging validated.")
          PYTHON

      - name: Start production stack
        run: docker compose up --build --detach

      - name: Verify backend health
        run: |
          for _ in {1..30}; do
            if curl --fail --silent \
              http://127.0.0.1:8000/api/v1/health; then
              exit 0
            fi
            sleep 2
          done

          docker compose logs
          exit 1

      - name: Verify authenticated Redis
        run: |
          docker compose exec -T \
            -e REDISCLI_AUTH="$REDIS_PASSWORD" \
            redis redis-cli ping \
            | grep -Fx "PONG"

      - name: Verify migrations and pgvector
        run: |
          docker compose exec -T postgres \
            psql -U agentflow -d agentflow -tAc \
            "SELECT version_num FROM alembic_version;" \
            | grep -Fx "ff2ca85c77b0"

          docker compose exec -T postgres \
            psql -U agentflow -d agentflow -tAc \
            "SELECT extname FROM pg_extension WHERE extname = 'vector';" \
            | grep -Fx "vector"

      - name: Stop production stack
        if: always()
        run: docker compose down --volumes --remove-orphans
