services:
  redis:
    image: redis:8.0-alpine
    command:
      - redis-server
      - --appendonly
      - "no"
      - --save
      - ""
      - --requirepass
      - ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}
    ports:
      - "${REDIS_PORT:-6379}:6379"
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}
    healthcheck:
      test:
        - CMD-SHELL
        - REDISCLI_AUTH="$$REDIS_PASSWORD" redis-cli ping | grep -Fx PONG
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-agentflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-agentflow}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - agentflow_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  migrate:
    build:
      context: ./backend
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-agentflow}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-agentflow}
    command:
      - alembic
      - upgrade
      - head
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  backend:
    build:
      context: ./backend
    env_file:
      - ./backend/.env
    environment:
      ENVIRONMENT: production
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-agentflow}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-agentflow}
      RATE_LIMIT_ENABLED: "true"
      REDIS_URL: redis://:${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}@redis:6379/0
      REDIS_MAX_CONNECTIONS: ${REDIS_MAX_CONNECTIONS:-20}
      REDIS_CONNECT_TIMEOUT_SECONDS: ${REDIS_CONNECT_TIMEOUT_SECONDS:-1}
      REDIS_SOCKET_TIMEOUT_SECONDS: ${REDIS_SOCKET_TIMEOUT_SECONDS:-1}
      RATE_LIMIT_KEY_HMAC_SECRET: ${RATE_LIMIT_KEY_HMAC_SECRET:?Set RATE_LIMIT_KEY_HMAC_SECRET in .env}
      RATE_LIMIT_STANDARD_CAPACITY: ${RATE_LIMIT_STANDARD_CAPACITY:-60}
      RATE_LIMIT_STANDARD_REFILL_RATE_PER_SECOND: ${RATE_LIMIT_STANDARD_REFILL_RATE_PER_SECOND:-1}
      RATE_LIMIT_EXPENSIVE_CAPACITY: ${RATE_LIMIT_EXPENSIVE_CAPACITY:-5}
      RATE_LIMIT_EXPENSIVE_REFILL_RATE_PER_SECOND: ${RATE_LIMIT_EXPENSIVE_REFILL_RATE_PER_SECOND:-0.1}
      TRUSTED_HOSTS: ${TRUSTED_HOSTS:?Set TRUSTED_HOSTS in .env}
      AUTH_ENABLED: ${AUTH_ENABLED:?Set AUTH_ENABLED in .env}
      AUTH_JWT_ISSUER: ${AUTH_JWT_ISSUER:?Set AUTH_JWT_ISSUER in .env}
      AUTH_JWT_AUDIENCE: ${AUTH_JWT_AUDIENCE:?Set AUTH_JWT_AUDIENCE in .env}
      AUTH_JWT_PUBLIC_KEY: ${AUTH_JWT_PUBLIC_KEY:?Set AUTH_JWT_PUBLIC_KEY in .env}

      # OpenTelemetry tracing
      OTEL_ENABLED: "${OTEL_ENABLED:-false}"
      OTEL_SERVICE_NAME: "${OTEL_SERVICE_NAME:-agentflow-ai-backend}"
      OTEL_EXPORTER_OTLP_ENDPOINT: "${OTEL_EXPORTER_OTLP_ENDPOINT:-}"
      OTEL_SAMPLE_RATIO: "${OTEL_SAMPLE_RATIO:-1}"

      # OpenTelemetry metrics
      OTEL_METRICS_ENABLED: "${OTEL_METRICS_ENABLED:-false}"
      OTEL_METRICS_EXPORTER_OTLP_ENDPOINT: "${OTEL_METRICS_EXPORTER_OTLP_ENDPOINT:-}"
      OTEL_METRICS_EXPORT_INTERVAL_MILLISECONDS: "${OTEL_METRICS_EXPORT_INTERVAL_MILLISECONDS:-60000}"
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    environment:
      AGENTFLOW_FRONTEND_BACKEND_BASE_URL: http://backend:8000
    ports:
      - "${FRONTEND_PORT:-8501}:8501"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  agentflow_postgres_data:
